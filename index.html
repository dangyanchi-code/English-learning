<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>外刊精读讲义库</title>
<style>
  :root {
    --paper:#fbfaf8; --card:#ffffff; --ink:#15171b; --soft:#4d535c;
    --muted:#8b929c; --rule:#e6e4df; --rule2:#f0eeea;
    --accent:#1c4e8a; --accent-soft:#eef4fb; --red:#c62a2f;
    --serif: Georgia, "Times New Roman", "Songti SC", "SimSun", serif;
    --sans: -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    --shadow: 0 1px 2px rgba(20,24,30,.04), 0 8px 24px -12px rgba(20,24,30,.14);
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body {
    margin:0; background:var(--paper); color:var(--ink);
    font:16px/1.75 var(--sans);
    background-image:
      radial-gradient(circle at 12% -8%, #eef4fb 0, transparent 42%),
      radial-gradient(circle at 92% 0%, #fdf1ef 0, transparent 38%);
    background-repeat:no-repeat;
  }
  .wrap { max-width:1080px; margin:0 auto; padding:0 28px 96px; }

  header.site { padding:56px 0 26px; border-bottom:2px solid var(--ink); }
  .brandline { display:flex; align-items:center; gap:12px; margin-bottom:20px; }
  .mark {
    background:var(--red); color:#fff; font:700 11px/1 var(--sans);
    letter-spacing:.14em; padding:7px 11px; border-radius:3px;
  }
  .brandline .kicker {
    font:600 11.5px/1 var(--sans); letter-spacing:.18em;
    text-transform:uppercase; color:var(--muted);
  }
  h1.title {
    margin:0; font-family:var(--serif); font-size:clamp(34px,5.2vw,54px);
    line-height:1.1; letter-spacing:-.015em; font-weight:700;
  }
  h1.title .cn {
    display:block; font-family:var(--sans); font-size:clamp(15px,2vw,19px);
    font-weight:500; color:var(--soft); letter-spacing:.06em; margin-top:14px;
  }
  .lede { margin:22px 0 0; max-width:62ch; color:var(--soft); font-size:16.5px; }
  .stats {
    display:flex; flex-wrap:wrap; gap:28px; margin-top:26px;
    padding-top:18px; border-top:1px solid var(--rule);
  }
  .stat b { display:block; font-family:var(--serif); font-size:26px; line-height:1; font-weight:700; }
  .stat span { font-size:12px; color:var(--muted); letter-spacing:.06em; }

  .toolbar {
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    margin:30px 0 22px; padding-bottom:14px; border-bottom:1px solid var(--rule);
  }
  .toolbar .label {
    font:600 11.5px/1 var(--sans); letter-spacing:.16em; text-transform:uppercase;
    color:var(--muted);
  }
  .chips { display:flex; gap:7px; flex-wrap:wrap; }
  .chip {
    border:1px solid var(--rule); background:var(--card); color:var(--soft);
    border-radius:99px; padding:5px 13px; font-size:13px; cursor:pointer;
    font-family:inherit; transition:.16s;
  }
  .chip:hover { border-color:var(--accent); color:var(--accent); }
  .chip[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }

  .grid {
    display:grid; gap:22px;
    grid-template-columns:repeat(auto-fit, minmax(360px, 1fr));
    align-items:start;
  }
  @media (max-width:820px) { .grid { grid-template-columns:1fr; } }

  .card {
    background:var(--card); border:1px solid var(--rule); border-radius:10px;
    padding:24px 26px 22px; box-shadow:var(--shadow);
    display:flex; flex-direction:column;
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .card:hover {
    transform:translateY(-2px); border-color:#d5d2cb;
    box-shadow:0 2px 4px rgba(20,24,30,.05), 0 18px 40px -18px rgba(20,24,30,.24);
  }
  .card-top { display:flex; align-items:center; gap:10px; margin-bottom:14px; font-size:12px; color:var(--muted); }
  .no { font-family:var(--serif); font-size:13px; color:var(--rule); font-weight:700; letter-spacing:.04em; }
  .src { display:flex; align-items:center; gap:5px; flex:1; min-width:0; flex-wrap:wrap; }
  .src .pub { color:var(--red); font-weight:600; }
  .sep { color:var(--rule); }
  .pill { border:1px solid var(--rule2); background:var(--paper); border-radius:99px; padding:2px 9px; font-size:11.5px; white-space:nowrap; }
  .pill.ok { color:var(--soft); }
  .pill.bad { color:#fff; background:var(--red); border-color:var(--red); }
  .card h2 { margin:0 0 6px; font-family:var(--serif); font-size:23px; line-height:1.25; letter-spacing:-.01em; font-weight:700; }
  .card .zh { margin:0 0 14px; color:var(--soft); font-size:14.5px; }
  .card .summary { margin:0 0 14px; color:var(--soft); font-size:14.5px; line-height:1.7; }
  .tags { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
  .tag { background:var(--accent-soft); color:var(--accent); border-radius:4px; padding:2px 9px; font-size:12px; }
  details { margin:0 0 18px; }
  details summary { cursor:pointer; color:var(--accent); font-size:13.5px; list-style:none; }
  details summary::-webkit-details-marker { display:none; }
  details summary::before { content:"▸ "; }
  details[open] summary::before { content:"▾ "; }
  details .count { color:var(--muted); }
  ul.secs { margin:10px 0 0; padding-left:18px; color:var(--soft); font-size:13.5px; line-height:1.9; }
  .actions { display:flex; gap:9px; flex-wrap:wrap; margin-top:auto; }
  .btn {
    display:inline-block; padding:9px 17px; border:1px solid var(--rule);
    border-radius:7px; text-decoration:none; color:var(--ink); font-size:13.5px;
    background:var(--card); transition:.16s; white-space:nowrap;
  }
  .btn:hover { border-color:var(--accent); color:var(--accent); }
  .btn.primary { background:var(--ink); border-color:var(--ink); color:#fff; }
  .btn.primary:hover { background:var(--accent); border-color:var(--accent); }
  .empty { border:1px dashed var(--rule); border-radius:10px; padding:40px; text-align:center; color:var(--muted); }
  .noresult { display:none; padding:32px; text-align:center; color:var(--muted); }
  footer.site { margin-top:44px; padding-top:20px; border-top:1px solid var(--rule); color:var(--muted); font-size:12.5px; line-height:1.9; }
  code { background:#f2f0ec; border:1px solid var(--rule2); border-radius:4px; padding:1px 5px; font-size:12px; font-family:ui-monospace, Consolas, monospace; }
  @media print {
    body { background:#fff; }
    .toolbar, .actions, footer.site { display:none; }
    .card { break-inside:avoid; box-shadow:none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="site">
    <div class="brandline">
      <span class="mark">CET-6</span>
      <span class="kicker">Intensive Reading Library</span>
    </div>
    <h1 class="title">
      <span>外刊精读</span>
      <span class="cn">外刊精读讲义库</span>
    </h1>
    <p class="lede">把《经济学人》等外刊原文做成六级精读讲义：六级标志词表 · 原文全文 · 精读练习 · 参考答案。每份讲义都按同一套版式生成，可直接打印。</p>
    <div class="stats">
      <div class="stat"><b>1</b><span>份讲义</span></div>
      <div class="stat"><b>10</b><span>个六级标志词</span></div>
      <div class="stat"><b>3</b><span>个主题</span></div>
    </div>
  </header>

  <div class="toolbar" id="toolbar">
    <span class="label">主题</span>
    <div class="chips" id="chips">
      <button class="chip" aria-pressed="true" data-tag="">全部</button>
      <button class="chip" aria-pressed="false" data-tag="人工智能">人工智能</button>
<button class="chip" aria-pressed="false" data-tag="科技">科技</button>
<button class="chip" aria-pressed="false" data-tag="科研">科研</button>
    </div>
  </div>

  <div class="grid" id="grid"></div>
  <p class="noresult" id="noresult">没有符合该主题的讲义。</p>

  <footer class="site">
    共 1 份讲义 · 由 .site/build_site.py 生成 · 纯静态页面，可直接托管在 GitHub Pages
  </footer>
</div>

<script id="cards-data" type="application/json">[{"no": "01", "href": "how-ai-can-revolutionise-science.pdf", "source": "The Economist · Leaders", "page": "p. 11", "date": "2026-10-10", "title": "How AI can revolutionise science", "zh": "人工智能如何变革科学", "topic": "科技与科研", "summary": "《经济学人》社论。AI 正在进入几乎所有科学领域，但采用程度差异极大——物理学与天文学论文中 7.2% 涉及 AI，兽医学只有 1.4%。文章把 AI 与显微镜、实验室、计算机相类比，认为真正的障碍不是技术而是社会性的：取决于科研人员是否愿意并且有能力使用这些工具。", "tags": ["科技", "人工智能", "科研"], "tags_attr": "科技 人工智能 科研", "size": "250 KB", "missing": false, "sections": ["词汇表：英文释义 + 原文出处，中文列留白自测", "原文全文，两栏排版", "PART 1 词汇：看释义写单词（10 题）", "PART 2 选词填空：15 选 10", "PART 3 阅读理解：5 题", "PART 4 汉译英：段落翻译，含作答横线", "PART 5 写作：150–200 词，含作答横线", "参考答案（末页，含中文释义）"]}]</script>
<script>
(function () {
  var data = JSON.parse(document.getElementById('cards-data').textContent);
  var grid = document.getElementById('grid');
  var noresult = document.getElementById('noresult');
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  var html = data.map(function (m) {
    var tags = (m.tags || []).map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('');
    var secs = (m.sections || []).map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('');
    return '<article class="card" data-tags="' + esc(m.tags_attr) + '">' +
      '<div class="card-top"><span class="no">' + esc(m.no) + '</span>' +
        '<div class="src"><span class="pub">' + esc(m.source) + '</span>' +
          (m.page ? '<span class="sep">/</span><span>' + esc(m.page) + '</span>' : '') +
          (m.date ? '<span class="sep">/</span><span>' + esc(m.date) + '</span>' : '') +
        '</div>' +
        (m.missing ? '<span class="pill bad">文件缺失</span>'
                   : '<span class="pill ok">' + esc(m.size) + '</span>') +
      '</div>' +
      '<h2>' + esc(m.title) + '</h2>' +
      '<p class="zh">' + esc(m.zh) + (m.topic ? ' <span class="sep">·</span> ' + esc(m.topic) : '') + '</p>' +
      '<p class="summary">' + esc(m.summary) + '</p>' +
      (tags ? '<div class="tags">' + tags + '</div>' : '') +
      (secs ? '<details><summary>讲义结构 <span class="count">' + m.sections.length +
              ' 个部分</span></summary><ul class="secs">' + secs + '</ul></details>' : '') +
      '<div class="actions">' +
        '<a class="btn primary" href="' + esc(m.href) + '" target="_blank" rel="noopener">翻开讲义</a>' +
        '<a class="btn" href="' + esc(m.href) + '" download>下载 PDF</a>' +
      '</div></article>';
  }).join('');
  grid.innerHTML = html || '<p class="empty">还没有讲义。</p>';

  var cards = [].slice.call(grid.querySelectorAll('.card'));
  document.getElementById('chips').addEventListener('click', function (e) {
    var btn = e.target.closest('.chip');
    if (!btn) return;
    [].forEach.call(document.querySelectorAll('.chip'), function (c) {
      c.setAttribute('aria-pressed', String(c === btn));
    });
    var tag = btn.dataset.tag, shown = 0;
    cards.forEach(function (c) {
      var hit = !tag || (c.dataset.tags || '').split(/\s+/).indexOf(tag) >= 0;
      c.style.display = hit ? '' : 'none';
      if (hit) shown++;
    });
    noresult.style.display = shown ? 'none' : 'block';
  });
})();
</script>
</body>
</html>
